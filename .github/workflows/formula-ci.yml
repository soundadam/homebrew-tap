name: Formula CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Formula/njulogin.rb"
      - "Formula/tea.rb"
      - "Casks/pace.rb"
      - "Casks/tonescope.rb"
      - "tap_migrations.json"
      - ".github/workflows/formula-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Formula/njulogin.rb"
      - "Formula/tea.rb"
      - "Casks/pace.rb"
      - "Casks/tonescope.rb"
      - "tap_migrations.json"
      - ".github/workflows/formula-ci.yml"

permissions:
  contents: read

concurrency:
  group: formula-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  njulogin:
    name: njulogin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect njulogin Formula
        id: formula
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Formula/njulogin.rb ]]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Report prepared job
        if: steps.formula.outputs.present != 'true'
        run: echo "Formula/njulogin.rb is not present yet; the dedicated job is prepared."

      - name: Audit, install, and test njulogin
        if: steps.formula.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          uname -m
          brew update

          test_tap=soundadam/njulogin-ci
          cleanup() {
            brew uninstall --force njulogin >/dev/null 2>&1 || true
            brew untap "$test_tap" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new --no-git "$test_tap"
          formula_path="$(brew --repo "$test_tap")/Formula/njulogin.rb"
          cp Formula/njulogin.rb "$formula_path"
          chmod 0644 "$formula_path"

          brew style "$formula_path"
          brew audit --strict --new --formula "$test_tap/njulogin"
          HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --build-from-source "$test_tap/njulogin"
          brew test "$test_tap/njulogin"

          formula_version="$({ brew info --json=v2 "$test_tap/njulogin"; } | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')"
          test "$(njulogin version)" = "njulogin $formula_version"

          build_metadata="$(go version -m "$(command -v njulogin)")"
          printf '%s\n' "$build_metadata"
          build_go="$(printf '%s\n' "$build_metadata" | awk 'NR == 1 {print $2}')"
          python3 - "$build_go" <<'PY'
          import re
          import sys

          match = re.fullmatch(r"go(\d+)\.(\d+)(?:\.(\d+))?.*", sys.argv[1])
          assert match, sys.argv[1]
          version = tuple(int(value or 0) for value in match.groups())
          assert version >= (1, 25, 12), version
          PY
          grep -Fq $'\tpath\tgithub.com/soundadam/njulogin/cmd/njulogin' <<<"$build_metadata"

          help_output="$(njulogin help 2>&1)"
          grep -q '^Usage:' <<<"$help_output"

          set +e
          njulogin </dev/null >"$RUNNER_TEMP/njulogin.stdout" 2>"$RUNNER_TEMP/njulogin.stderr"
          nonterminal_status=$?
          njulogin unknown-command >"$RUNNER_TEMP/njulogin-unknown.stdout" 2>"$RUNNER_TEMP/njulogin-unknown.stderr"
          unknown_status=$?
          set -e
          test "$nonterminal_status" -eq 2
          test "$unknown_status" -eq 2
          grep -q '^Usage:' "$RUNNER_TEMP/njulogin.stderr"

  pace:
    name: pace cask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Audit, install, and smoke-test pace cask
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          uname -m
          brew update

          test_tap=soundadam/pace-ci
          cleanup() {
            brew uninstall --cask --force pace >/dev/null 2>&1 || true
            brew untap "$test_tap" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new --no-git "$test_tap"
          tap_repo="$(brew --repo "$test_tap")"
          mkdir -p "$tap_repo/Casks"
          cask_path="$tap_repo/Casks/pace.rb"
          cp Casks/pace.rb "$cask_path"
          chmod 0644 "$cask_path"

          brew style "$cask_path"
          brew audit --cask "$test_tap/pace"
          HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --cask "$test_tap/pace"

          cask_version="$({ brew info --json=v2 --cask "$test_tap/pace"; } | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          got="$(pace version)"
          printf 'pace version: %s\n' "$got"
          test "$got" = "pace $cask_version"

          acceptance_home="$RUNNER_TEMP/pace-home"
          mkdir -p "$acceptance_home"
          set +e
          diagnostics="$(HOME="$acceptance_home" pace doctor --json)"
          doctor_status=$?
          set -e
          printf 'pace doctor exit: %s\n' "$doctor_status"
          printf '%s\n' "$diagnostics"
          printf '%s\n' "$diagnostics" | python3 -c 'import json,sys; value=json.load(sys.stdin); assert "ready" in value and "providers" in value, value; assert value.get("version") == sys.argv[1], value' "$cask_version"
          test "$(HOME="$acceptance_home" pace history --json)" = "[]"

  tea:
    name: tea (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Audit, install, and test tea
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          uname -m
          brew update

          test_tap=soundadam/tea-ci
          cleanup() {
            brew uninstall --force tea >/dev/null 2>&1 || true
            brew untap "$test_tap" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new --no-git "$test_tap"
          formula_path="$(brew --repo "$test_tap")/Formula/tea.rb"
          cp Formula/tea.rb "$formula_path"

          brew style "$formula_path"
          brew audit --strict --new --formula "$test_tap/tea"
          HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --build-from-source "$test_tap/tea"
          brew test "$test_tap/tea"

          formula_version="$({ brew info --json=v2 "$test_tap/tea"; } | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')"
          test "$(tea version)" = "tea $formula_version"

          help_output="$(tea help)"
          grep -q '^Usage:' <<<"$help_output"
          auth_status="$(tea auth status)"
          grep -q '^authorization: unregistered$' <<<"$auth_status"

          set +e
          helper_error="$(tea __tea_privileged version 2>&1)"
          helper_status=$?
          set -e
          test "$helper_status" -eq 77
          grep -q 'privileged helper must run as root' <<<"$helper_error"

  tonescope:
    name: tonescope cask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
          - ubuntu-24.04
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit, install, and check tonescope cask
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f Casks/tonescope.rb ]]; then
            echo "Casks/tonescope.rb is not present yet; the tonescope release workflow writes it."
            exit 0
          fi

          uname -sm
          brew update

          test_tap=soundadam/tonescope-ci
          cleanup() {
            brew uninstall --cask --force tonescope >/dev/null 2>&1 || true
            brew untap "$test_tap" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new --no-git "$test_tap"
          tap_repo="$(brew --repo "$test_tap")"
          mkdir -p "$tap_repo/Casks"
          cask_path="$tap_repo/Casks/tonescope.rb"
          cp Casks/tonescope.rb "$cask_path"
          chmod 0644 "$cask_path"

          brew style "$cask_path"
          brew audit --cask "$test_tap/tonescope"
          HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --cask "$test_tap/tonescope"

          cask_version="$({ brew info --json=v2 --cask "$test_tap/tonescope"; } | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"

          # GUI 程序，CI 里不启动；只查装上的是不是这个版本、这个架构
          if [[ "$RUNNER_OS" == macOS ]]; then
            test -d /Applications/Tonescope.app
            plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Tonescope.app/Contents/Info.plist)"
            test "$plist_version" = "$cask_version"
            archs="$(lipo -archs /Applications/Tonescope.app/Contents/MacOS/tonescope)"
            printf 'archs: %s\n' "$archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
            codesign --verify --strict /Applications/Tonescope.app
          else
            bin="$(command -v tonescope)"
            file -L "$bin"
            file -L "$bin" | grep -q 'ELF 64-bit.*x86-64'
          fi
