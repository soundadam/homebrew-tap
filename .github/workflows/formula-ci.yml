name: Formula CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Casks/nju-connect.rb"
      - "Casks/njulogin.rb"
      - "Casks/pace.rb"
      - "Casks/tea.rb"
      - "Casks/tonescope.rb"
      - "tap_migrations.json"
      - ".github/workflows/formula-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Casks/nju-connect.rb"
      - "Casks/njulogin.rb"
      - "Casks/pace.rb"
      - "Casks/tea.rb"
      - "Casks/tonescope.rb"
      - "tap_migrations.json"
      - ".github/workflows/formula-ci.yml"

permissions:
  contents: read

concurrency:
  group: formula-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pace:
    name: pace cask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Audit, install, and smoke-test pace cask
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          uname -m
          brew update

          test_tap=soundadam/pace-ci
          cleanup() {
            brew uninstall --cask --force pace >/dev/null 2>&1 || true
            brew untap "$test_tap" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new --no-git "$test_tap"
          # Homebrew loads Casks only from trusted taps.
          brew trust "$test_tap"
          tap_repo="$(brew --repo "$test_tap")"
          mkdir -p "$tap_repo/Casks"
          cask_path="$tap_repo/Casks/pace.rb"
          cp Casks/pace.rb "$cask_path"
          chmod 0644 "$cask_path"

          brew style "$cask_path"
          brew audit --cask "$test_tap/pace"
          HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --cask "$test_tap/pace"

          cask_version="$({ brew info --json=v2 --cask "$test_tap/pace"; } | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          got="$(pace version)"
          printf 'pace version: %s\n' "$got"
          test "$got" = "pace $cask_version"

          acceptance_home="$RUNNER_TEMP/pace-home"
          mkdir -p "$acceptance_home"
          set +e
          diagnostics="$(HOME="$acceptance_home" pace doctor --json)"
          doctor_status=$?
          set -e
          printf 'pace doctor exit: %s\n' "$doctor_status"
          printf '%s\n' "$diagnostics"
          printf '%s\n' "$diagnostics" | python3 -c 'import json,sys; value=json.load(sys.stdin); assert "ready" in value and "providers" in value, value; assert value.get("version") == sys.argv[1], value' "$cask_version"
          test "$(HOME="$acceptance_home" pace history --json)" = "[]"

  tea:
    name: tea cask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Audit, install, and test tea cask
        shell: bash
        run: |
          set -euo pipefail

          sw_vers
          uname -m
          brew update

          test_tap=soundadam/tea-ci
          cleanup() {
            brew uninstall --cask --force "$test_tap/tea" >/dev/null 2>&1 || true
            brew untap "$test_tap" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new --no-git "$test_tap"
          # Homebrew loads Casks only from trusted taps.
          brew trust "$test_tap"
          tap_repo="$(brew --repo "$test_tap")"
          mkdir -p "$tap_repo/Casks"
          cask_path="$tap_repo/Casks/tea.rb"
          cp Casks/tea.rb "$cask_path"
          chmod 0644 "$cask_path"

          brew style "$cask_path"
          brew audit --cask "$test_tap/tea"
          HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --cask "$test_tap/tea"

          cask_version="$({ brew info --json=v2 --cask "$test_tap/tea"; } | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          test "$(tea version)" = "tea $cask_version"

          # postflight clears quarantine on the ad-hoc signed executable
          exe="$(realpath "$(command -v tea)")"
          if xattr -p com.apple.quarantine "$exe" >/dev/null 2>&1; then
            echo "::error::$exe is still quarantined"
            exit 1
          fi
          codesign --verify --strict "$exe"

          help_output="$(tea help)"
          grep -q '^Usage:' <<<"$help_output"
          auth_status="$(tea auth status)"
          grep -q '^authorization: unregistered$' <<<"$auth_status"

          set +e
          helper_error="$(tea __tea_privileged version 2>&1)"
          helper_status=$?
          set -e
          test "$helper_status" -eq 77
          grep -q 'privileged helper must run as root' <<<"$helper_error"

  tonescope:
    name: tonescope cask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
          - ubuntu-24.04
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit, install, and check tonescope cask
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f Casks/tonescope.rb ]]; then
            echo "Casks/tonescope.rb is not present yet; the tonescope release workflow writes it."
            exit 0
          fi

          uname -sm
          brew update

          test_tap=soundadam/tonescope-ci
          cleanup() {
            brew uninstall --cask --force tonescope >/dev/null 2>&1 || true
            brew untap "$test_tap" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new --no-git "$test_tap"
          # Homebrew loads Casks only from trusted taps.
          brew trust "$test_tap"
          tap_repo="$(brew --repo "$test_tap")"
          mkdir -p "$tap_repo/Casks"
          cask_path="$tap_repo/Casks/tonescope.rb"
          cp Casks/tonescope.rb "$cask_path"
          chmod 0644 "$cask_path"

          brew style "$cask_path"
          brew audit --cask "$test_tap/tonescope"
          HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --cask "$test_tap/tonescope"

          cask_version="$({ brew info --json=v2 --cask "$test_tap/tonescope"; } | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"

          # GUI 程序，CI 里不启动；只查装上的是不是这个版本、这个架构
          if [[ "$RUNNER_OS" == macOS ]]; then
            test -d /Applications/Tonescope.app
            plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Tonescope.app/Contents/Info.plist)"
            test "$plist_version" = "$cask_version"
            archs="$(lipo -archs /Applications/Tonescope.app/Contents/MacOS/tonescope)"
            printf 'archs: %s\n' "$archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
            codesign --verify --strict /Applications/Tonescope.app
          else
            bin="$(command -v tonescope)"
            file -L "$bin"
            file -L "$bin" | grep -q 'ELF 64-bit.*x86-64'
          fi

  nju-connect:
    name: nju-connect cask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
          - ubuntu-24.04
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit, install, and test nju-connect cask
        shell: bash
        run: |
          set -euo pipefail

          uname -sm
          brew update

          test_tap=soundadam/nju-connect-ci
          cleanup() {
            brew uninstall --cask --force "$test_tap/nju-connect" >/dev/null 2>&1 || true
            brew untap "$test_tap" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new --no-git "$test_tap"
          # Homebrew loads Casks only from trusted taps.
          brew trust "$test_tap"
          tap_repo="$(brew --repo "$test_tap")"
          mkdir -p "$tap_repo/Casks"
          cask_path="$tap_repo/Casks/nju-connect.rb"
          cp Casks/nju-connect.rb "$cask_path"
          chmod 0644 "$cask_path"

          # The Cask depends on soundadam/tap/librespeed-cli-nju-connect; tap this
          # checkout under that name so the dependency comes from the same commit.
          # Its own dependencies (go) install from the API. Trust the tap as the
          # README tells users to.
          brew tap | grep -qx soundadam/tap || brew tap soundadam/tap "$GITHUB_WORKSPACE"
          brew trust --tap soundadam/tap

          brew style "$cask_path"
          brew audit --cask "$test_tap/nju-connect"
          brew install --cask "$test_tap/nju-connect"

          cask_version="$({ brew info --json=v2 --cask "$test_tap/nju-connect"; } | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          test "$(nju-connect version)" = "nju-connect $cask_version"

          set +e
          nju-connect unknown-command >/dev/null 2>&1
          unknown_status=$?
          set -e
          test "$unknown_status" -eq 2

          # The menu bar app is not launched in CI; check what was installed.
          if [[ "$RUNNER_OS" == macOS ]]; then
            app=/Applications/nju-connect.app
            plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
            test "$plist_version" = "$cask_version"
            test "$(realpath "$(command -v nju-connect)")" = "$(realpath "$app/Contents/Helpers/nju-connect")"
            archs="$(lipo -archs "$app/Contents/MacOS/nju-connect-menu")"
            printf 'archs: %s\n' "$archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
            codesign --verify --strict "$app"
            # postflight clears quarantine on the ad-hoc signed app
            if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
              echo "::error::$app is still quarantined"
              exit 1
            fi
          else
            file -L "$(command -v nju-connect)" | grep -q 'ELF 64-bit.*x86-64'
          fi

  njulogin-cask:
    name: njulogin cask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
          - ubuntu-24.04
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit, install, and test njulogin cask
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f Casks/njulogin.rb ]]; then
            echo "Casks/njulogin.rb is not present yet; the njulogin release workflow writes it."
            exit 0
          fi

          uname -sm
          brew update

          test_tap=soundadam/njulogin-cask-ci
          cleanup() {
            brew uninstall --cask --force "$test_tap/njulogin" >/dev/null 2>&1 || true
            brew untap "$test_tap" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new --no-git "$test_tap"
          # Homebrew loads Casks only from trusted taps.
          brew trust "$test_tap"
          tap_repo="$(brew --repo "$test_tap")"
          mkdir -p "$tap_repo/Casks"
          cask_path="$tap_repo/Casks/njulogin.rb"
          cp Casks/njulogin.rb "$cask_path"
          chmod 0644 "$cask_path"

          brew style "$cask_path"
          brew audit --cask "$test_tap/njulogin"
          HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --cask "$test_tap/njulogin"

          cask_version="$({ brew info --json=v2 --cask "$test_tap/njulogin"; } | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          test "$(njulogin version)" = "njulogin $cask_version"

          help_output="$(njulogin help 2>&1)"
          grep -q '^Usage:' <<<"$help_output"

          set +e
          njulogin </dev/null >"$RUNNER_TEMP/njulogin.stdout" 2>"$RUNNER_TEMP/njulogin.stderr"
          nonterminal_status=$?
          njulogin unknown-command >/dev/null 2>&1
          unknown_status=$?
          set -e
          test "$nonterminal_status" -eq 2
          test "$unknown_status" -eq 2
          grep -q '^Usage:' "$RUNNER_TEMP/njulogin.stderr"

          if [[ "$RUNNER_OS" == macOS ]]; then
            # postflight clears quarantine on the ad-hoc signed executable
            exe="$(realpath "$(command -v njulogin)")"
            if xattr -p com.apple.quarantine "$exe" >/dev/null 2>&1; then
              echo "::error::$exe is still quarantined"
              exit 1
            fi
            codesign --verify --strict "$exe"
          fi
